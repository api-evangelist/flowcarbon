aid: flowcarbon
name: Flowcarbon
description: >-
  Flowcarbon is a climate-finance company that provides project finance and bespoke
  capital solutions for companies working in infrastructure, decarbonization, and
  frontier climate industries. Its end-to-end services span project origination,
  screening and due diligence, deal structuring, and tax-credit solutions, with a
  focus on engineered carbon-removal technologies such as biochar and enhanced rock
  weathering. Founded with a web3 heritage in tokenized voluntary carbon credits and
  backed by a16z and General Catalyst, Flowcarbon today operates primarily as a
  climate project-finance firm rather than a developer platform, and publishes no
  public developer API, SDK, or API documentation.
